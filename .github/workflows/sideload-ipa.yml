name: Build sideload IPA (Sure + widget)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA for SideStore
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Build IPA
        working-directory: mobile
        env:
          LANG: en_US.UTF-8
        run: bash ios/build_sideload_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Sure-with-widget
          path: mobile/build/sideload/Sure-with-widget.ipa
          if-no-files-found: error
