# Sure (personal finance) for Kyle's Raspberry Pi
# Based on the official compose.example.yml from github.com/we-promise/sure
# Changes from upstream:
#   - SECRET_KEY_BASE and POSTGRES_PASSWORD are REQUIRED (no insecure defaults)
#   - Plaid + APP_DOMAIN + onboarding settings passed through from .env
#   - Yahoo Finance as the free exchange-rate/securities provider
#   - Redis pinned to a major version; backup profile removed (add later if wanted)

x-db-env: &db_env
  POSTGRES_USER: ${POSTGRES_USER:-sure_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-sure_production}

x-rails-env: &rails_env
  <<: *db_env
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env}
  SELF_HOSTED: "true"
  ONBOARDING_STATE: ${ONBOARDING_STATE:-open}
  APP_DOMAIN: ${APP_DOMAIN:-}
  RAILS_FORCE_SSL: "false"
  # Set to "true" once you access Sure through Tailscale HTTPS (tailscale serve)
  RAILS_ASSUME_SSL: ${RAILS_ASSUME_SSL:-false}
  DB_HOST: db
  DB_PORT: 5432
  REDIS_URL: redis://redis:6379/1

  # --- Plaid bank sync ---
  # Start with sandbox keys; switch to production keys once the Trial is approved.
  PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
  PLAID_SECRET: ${PLAID_SECRET:-}
  PLAID_ENV: ${PLAID_ENV:-sandbox}

  # --- Free market data (no API key needed) ---
  EXCHANGE_RATE_PROVIDER: yahoo_finance
  SECURITIES_PROVIDER: yahoo_finance

  # --- Optional AI (leave blank for now; can point at Ollama later) ---
  OPENAI_ACCESS_TOKEN: ${OPENAI_ACCESS_TOKEN:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  OPENAI_URI_BASE: ${OPENAI_URI_BASE:-}

services:
  web:
    image: ghcr.io/we-promise/sure:stable
    volumes:
      - app-storage:/rails/storage
    ports:
      - ${PORT:-3000}:3000
    restart: unless-stopped
    environment:
      <<: *rails_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - sure_net

  worker:
    image: ghcr.io/we-promise/sure:stable
    command: bundle exec sidekiq
    volumes:
      - app-storage:/rails/storage
    restart: unless-stopped
    environment:
      <<: *rails_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - sure_net

  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      <<: *db_env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sure_net

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sure_net

volumes:
  app-storage:
  postgres-data:
  redis-data:

networks:
  sure_net:
    driver: bridge
